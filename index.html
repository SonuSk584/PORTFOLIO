  <!-- Loading screen styles: shown instantly, before the JavaScript has loaded -->
  <style>
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0A0D0B;color:#B6FF3B;font:500 15px "JetBrains Mono",monospace}
    #boot i{display:block;width:180px;height:2px;background:#26302A;overflow:hidden;position:relative}
    #boot i:after{content:"";position:absolute;inset:0;width:40%;background:#B6FF3B;animation:bt 1.1s ease-in-out infinite}
    @keyframes bt{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  </style>
</head>

  <div id="root">
    <div id="boot" role="status" aria-label="Loading"><span>&gt; loading portfolio_</span><i></i></div>
